<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Cinema Ticket Booking software architecture</title>
  <desc id="desc">React clients connect to Spring Boot APIs, realtime seat channels, database, and external services.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#2563eb" />
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 14; }
      .group { fill: #eff6ff; stroke: #93c5fd; stroke-width: 2; rx: 18; }
      .title { font: 700 28px Arial, sans-serif; fill: #0f172a; }
      .label { font: 700 18px Arial, sans-serif; fill: #1e293b; }
      .small { font: 500 14px Arial, sans-serif; fill: #475569; }
      .arrow { stroke: #2563eb; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .dash { stroke-dasharray: 8 8; }
    </style>
  </defs>
  <rect class="bg" width="1200" height="720" />
  <text class="title" x="60" y="58">Cinema Ticket Booking - Software Architecture</text>

  <rect class="group" x="60" y="105" width="250" height="470" />
  <text class="label" x="90" y="145">React Frontend</text>
  <rect class="box" x="90" y="175" width="190" height="78" />
  <text class="label" x="114" y="206">Customer Web</text>
  <text class="small" x="114" y="230">movies, booking, account</text>
  <rect class="box" x="90" y="285" width="190" height="78" />
  <text class="label" x="114" y="316">Admin Web</text>
  <text class="small" x="114" y="340">dashboard, CRUD, orders</text>
  <rect class="box" x="90" y="395" width="190" height="78" />
  <text class="label" x="114" y="426">ChatBot</text>
  <text class="small" x="114" y="450">Gemini assistant UI</text>

  <rect class="group" x="390" y="105" width="360" height="470" />
  <text class="label" x="425" y="145">Spring Boot Backend</text>
  <rect class="box" x="425" y="175" width="290" height="72" />
  <text class="label" x="455" y="205">REST Controllers</text>
  <text class="small" x="455" y="228">auth, movie, showtime, order</text>
  <rect class="box" x="425" y="275" width="290" height="72" />
  <text class="label" x="455" y="305">Service Layer</text>
  <text class="small" x="455" y="328">booking, seat inventory, payment</text>
  <rect class="box" x="425" y="375" width="290" height="72" />
  <text class="label" x="455" y="405">JPA Repositories</text>
  <text class="small" x="455" y="428">entities and queries</text>
  <rect class="box" x="425" y="475" width="290" height="72" />
  <text class="label" x="455" y="505">STOMP WebSocket</text>
  <text class="small" x="455" y="528">seat hold/release broadcast</text>

  <rect class="group" x="830" y="105" width="300" height="470" />
  <text class="label" x="865" y="145">Data &amp; Integrations</text>
  <rect class="box" x="865" y="175" width="230" height="64" />
  <text class="label" x="900" y="203">MySQL</text>
  <text class="small" x="900" y="224">tickets, orders, users</text>
  <rect class="box" x="865" y="265" width="230" height="64" />
  <text class="label" x="900" y="293">VNPay</text>
  <text class="small" x="900" y="314">checkout return/IPN</text>
  <rect class="box" x="865" y="355" width="230" height="64" />
  <text class="label" x="900" y="383">Google &amp; SMTP</text>
  <text class="small" x="900" y="404">OAuth, OTP email</text>
  <rect class="box" x="865" y="445" width="230" height="64" />
  <text class="label" x="900" y="473">Gemini API</text>
  <text class="small" x="900" y="494">tool-calling assistant</text>

  <path class="arrow" d="M280 214 H425" />
  <path class="arrow" d="M280 324 H425" />
  <path class="arrow dash" d="M280 434 H425" />
  <path class="arrow" d="M715 311 H865" />
  <path class="arrow" d="M715 411 H865" />
  <path class="arrow" d="M715 511 H865" />
  <path class="arrow" d="M715 211 H865" />

  <rect class="box" x="235" y="625" width="730" height="58" />
  <text class="small" x="265" y="650">Main flow: User selects movie/showtime -> holds seats in realtime -> creates order/ticket -> pays by VNPay -> admin monitors revenue and orders.</text>
  <text class="small" x="265" y="672">Security: JWT resource server, role-based admin area, email OTP verification and Google login.</text>
</svg>
